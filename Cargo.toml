[package]
name = "particle-life"
version = "0.1.0"
edition = "2024"

[dependencies]
# wgpu: the GPU abstraction layer. Works on Vulkan/Metal/DX12/WebGPU.
wgpu = "0.20"

# winit: cross-platform window creation and event loop.
winit = "0.29"

# bytemuck: lets us safely cast Rust structs to raw bytes for GPU upload.
# The derive macros give us Pod + Zeroable on our vertex structs.
bytemuck = { version = "1.14", features = ["derive"] }

# pollster: tiny crate to block on async functions.
# wgpu init is async; we use this in main() to avoid a full async runtime.
pollster = "0.3"

# env_logger + log: lets wgpu print validation errors and warnings.
# Run with RUST_LOG=warn to see them.
env_logger = "0.11"
log = "0.4"

# rand: random number generation for initial particle placement.
rand = "0.8"

# HTTP server for React control panel
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }